services:
  web:
    build: .
    image: dual-stream-ar-demo:latest
    container_name: dual-stream-ar-demo
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
